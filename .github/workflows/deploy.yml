# Builds index.html from src/ and publishes the site to GitHub Pages on every push to main.
# The site is plain HTML + ES modules (three.js from a CDN): no npm install, no bundler.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from src/
        run: bash build.sh

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r audio textures models images _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
